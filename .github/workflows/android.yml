name: Build Android APK

# Builds an installable Rhythia APK in the cloud (no PC needed).
# Run it from the Actions tab -> "Build Android APK" -> "Run workflow",
# or it runs automatically on every push to the android branch.
# The APK is attached to the finished run under "Artifacts".

on:
  push:
    branches: [android]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Read Godot version
        id: ver
        run: echo "godot=$(tr -d '[:space:]' < .github/godot_version.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache Godot editor and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-mono-${{ steps.ver.outputs.godot }}

      - name: Install Godot ${{ steps.ver.outputs.godot }} (.NET)
        env:
          V: ${{ steps.ver.outputs.godot }}
        run: |
          set -e
          TPL_DIR="$HOME/.local/share/godot/export_templates/${V}.stable.mono"
          if [ ! -x "$HOME/godot/godot" ] || [ ! -d "$TPL_DIR" ]; then
            BASE="https://github.com/godotengine/godot-builds/releases/download/${V}-stable"
            mkdir -p "$HOME/godot" "$TPL_DIR"
            cd "$HOME/godot"
            curl -fL --retry 3 -o editor.zip "$BASE/Godot_v${V}-stable_mono_linux_x86_64.zip"
            unzip -q editor.zip && rm editor.zip
            mv Godot_v${V}-stable_mono_linux_x86_64/* . && rmdir Godot_v${V}-stable_mono_linux_x86_64
            ln -sf "$HOME/godot/Godot_v${V}-stable_mono_linux.x86_64" "$HOME/godot/godot"
            curl -fL --retry 3 -o templates.tpz "$BASE/Godot_v${V}-stable_mono_export_templates.tpz"
            unzip -q templates.tpz && mv templates/* "$TPL_DIR/" && rm -rf templates templates.tpz
          fi
          "$HOME/godot/godot" --version

      # One signing key is kept between builds so new APKs install over old ones
      # (otherwise Android makes you uninstall first). Stored in the Actions cache.
      - name: Restore signing key
        id: key
        uses: actions/cache@v4
        with:
          path: ~/rhythia-release.keystore
          key: rhythia-android-keystore-v1

      - name: Create signing key
        if: steps.key.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v -keystore ~/rhythia-release.keystore -alias rhythia \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass rhythia-android -keypass rhythia-android \
            -dname "CN=Rhythia Mobile, O=Rhythia, C=GB"

      - name: Point Godot at the Android SDK and Java
        env:
          V: ${{ steps.ver.outputs.godot }}
        run: |
          MINOR=$(echo "$V" | cut -d. -f1,2)
          MAJOR=$(echo "$V" | cut -d. -f1)
          mkdir -p ~/.config/godot
          # Godot names this file by minor version on newer releases, major on older ones
          for NAME in "$MINOR" "$MAJOR"; do
          cat > ~/.config/godot/editor_settings-${NAME}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          done
          cat ~/.config/godot/editor_settings-${MINOR}.tres

      - name: Restore .NET packages
        run: dotnet restore Rhythia.csproj

      - name: Compile game code
        run: dotnet build Rhythia.csproj -c ExportRelease

      - name: Import project
        run: |
          # First headless run imports assets (it can exit non-zero on harmless warnings)
          timeout 20m ~/godot/godot --headless --path . --import || true

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/rhythia-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: rhythia
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: rhythia-android
        run: |
          mkdir -p build/android
          # .NET 10 needs a gradle build (the prebuilt template only supports .NET 9)
          ~/godot/godot --headless --path . --install-android-build-template --export-release "Android" build/android/Rhythia.apk
          test -f build/android/Rhythia.apk || { echo "::error::Export did not produce an APK"; exit 1; }

      - name: Check APK contents
        run: |
          ls -lh build/android/Rhythia.apk
          unzip -l build/android/Rhythia.apk | grep -E "lib/arm64-v8a/.*\.so" || true
          if ! unzip -l build/android/Rhythia.apk | grep -q "libe_sqlite3"; then
            echo "::warning::SQLite native library (libe_sqlite3.so) not found in APK - stats/database may fail on device"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rhythia-android-apk
          path: build/android/Rhythia.apk
          compression-level: 0
